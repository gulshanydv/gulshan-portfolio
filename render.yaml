services:
  - type: web
    name: gulshan-ai-chatbot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn chatbot_server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
